0" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">“识”为识别码（末笔/字型），单独标注，不与普通字根混排。</text><text x="814" y="555" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">四个字以内按列并排；超过四个字时只显示当前错字所在位置对应的单字。</text><text x="794" y="670" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">词组错误时：先展示整词各字拆法，用户仍可继续输完整词组码；根条不阻塞输入。</text><rect x="794" y="700" width="88" height="32" rx="8" fill="#fffdf8" stroke="#e7dfd2" stroke-width="1.2"/><text x="838" y="721" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="500" text-anchor="middle" opacity="1">跳过</text><rect x="894" y="700" width="100" height="32" rx="8" fill="#fffdf8" stroke="#e7dfd2" stroke-width="1.2"/><text x="944" y="721" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="500" text-anchor="middle" opacity="1">看提示</text><text x="794" y="770" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">键盘区保持原位（本图省略）</text><text x="40" y="900" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">放置规则：单字根条在提示行下方、操作按钮上方；词组根条在同一位置展开，按字横向分栏。</text><text x="40" y="924" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">颜色：字根主色黑、键位字母红；识别码用“识”标签区分；错误字仍用红色 + 波浪线。</text><text x="40" y="948" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">默认只在打错后展开；不改动现有键盘、统计与进度布局。示意图，最终间距以实现为准。</text></svg>