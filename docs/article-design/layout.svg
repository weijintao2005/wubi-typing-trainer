="start" opacity="1">zip / word/document.xml</text><rect x="40" y="730" width="380" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="58" y="760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">python-docx 解析</text><text x="58" y="784" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">段落 · 运行 · 表格 · 图片 · 样式</text><rect x="520" y="130" width="420" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="538" y="160" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">编码与安全校验</text><text x="538" y="184" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">文件头 / 大小 / 解压上限 / 无宏执行</text><rect x="520" y="270" width="420" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="538" y="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">块模型 blocks[]</text><text x="538" y="324" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">paragraph / table / image / pageBreak</text><rect x="520" y="410" width="420" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="538" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">运行样式 runs[]</text><text x="538" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">bold · italic · underline · size · color</text><rect x="520" y="550" width="420" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="538" y="580" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">段落样式</text><text x="538" y="604" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">对齐 · 左右缩进 · 首行缩进 · 行距</text><rect x="520" y="690" width="420" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="538" y="720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">表格 / 图片</text><text x="538" y="744" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">表格行优先；图片只展示、不输入</text><line x1="420" y1="178" x2="520" y2="178" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="420" y1="318" x2="520" y2="318" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="420" y1="458" x2="520" y2="458" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="420" y1="638" x2="520" y2="638" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="420" y1="778" x2="520" y2="778" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="1010" y="130" width="450" height="680" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="1034" y="162" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">统一渲染结果（按原结构）</text><text x="1034" y="196" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">标题（居中/加粗/字号）</text><text x="1034" y="224" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">首行缩进两字，正文行距按原文。已输入黑色，未输入淡灰。</text><text x="1034" y="248" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#c0392b" font-weight="400" text-anchor="start" opacity="1">错误字红色并加波浪线。</text><rect x="1034" y="272" width="390" height="86" rx="8" fill="#fbf7ef" stroke="#d8cebd" stroke-width="1" opacity="1" stroke-dasharray="4 3"/><text x="1050" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">表格：按行优先逐格输入；边界自动越过。</text><text x="1050" y="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">图片：只展示，不参与输入。</text><text x="1050" y="342" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">分页：以分隔线显示，不按纸张分页。</text><text x="1034" y="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">输入顺序：block → run → char（顺序展开）</text><text x="1034" y="428" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">段落/表格/图片边界自动推进；</text><text x="1034" y="452" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">不需要输入换行或 Tab。</text><text x="1034" y="494" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">文档模型片段</text><rect x="1034" y="510" width="400" height="180" rx="8" fill="#f6f2ea" stroke="#efe8dc" stroke-width="0" opacity="1"/><text x="1048" y="536" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#2b2620" font-weight="400" text-anchor="start" opacity="1">{ &quot;blocks&quot;: [</text><text x="1048" y="558" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#2b2620" font-weight="400" text-anchor="start" opacity="1">  {&quot;type&quot;:&quot;p&quot;,&quot;align&quot;:&quot;left&quot;,</text><text x="1048" y="580" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#2b2620" font-weight="400" text-anchor="start" opacity="1">   &quot;indent&quot;:2,</text><text x="1048" y="602" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#2b2620" font-weight="400" text-anchor="start" opacity="1">   &quot;runs&quot;:[{&quot;text&quot;:&quot;荷塘月色&quot;,&quot;bold&quot;:true}]},</text><text x="1048" y="624" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#2b2620" font-weight="400" text-anchor="start" opacity="1">  {&quot;type&quot;:&quot;table&quot;,&quot;rows&quot;:[...]},</text><text x="1048" y="646" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#2b2620" font-weight="400" text-anchor="start" opacity="1">  {&quot;type&quot;:&quot;image&quot;,&quot;src&quot;:&quot;media/1.png&quot;}</text><text x="1048" y="668" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" fill="#2b2620" font-weight="400" text-anchor="start" opacity="1">]}</text><text x="1034" y="720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">可输入单元由 blocks/runs 顺序展开，</text><text x="1034" y="742" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">每个字带 block/run 样式引用，</text><text x="1034" y="764" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">因此着色不会破坏排版。</text><line x1="230" y1="226" x2="230" y2="270" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/>
