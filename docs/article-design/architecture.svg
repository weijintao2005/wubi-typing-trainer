<text x="40" y="46" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="24" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">文章练习 · 总体架构</text>
<text x="40" y="72" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">本地文件上传 → 服务端解析 → 文档模型 → 逐字练习 → 进度持久化；全程无外网</text>
<text x="50" y="120" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">浏览器（SPA）</text><text x="520" y="120" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">Python 本地服务 app.py</text><text x="1040" y="120" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">SQLite progress.db</text><rect x="40" y="145" width="400" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="58" y="175" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">文章库 / 导入</text><text x="58" y="199" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">选择或拖入 .txt / .docx；显示标题、字数、进度</text><rect x="40" y="285" width="400" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="58" y="315" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">逐字练习引擎</text><text x="58" y="339" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">五笔码 / 标点映射；灰→黑→红着色与推进</text><rect x="40" y="425" width="400" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="58" y="455" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">文章练习界面</text><text x="58" y="479" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">按原文结构排版；当前字滚动到可视区</text><rect x="40" y="565" width="400" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="58" y="595" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">进度批量保存</text><text x="58" y="619" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">每 20 字或 2 秒 PATCH；断点续练</text><rect x="500" y="145" width="450" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="518" y="175" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">POST /api/articles</text><text x="518" y="199" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">base64 上传；类型/大小/压缩炸弹校验</text><rect x="500" y="285" width="450" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="518" y="315" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">文档解析器</text><text x="518" y="339" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">txt：编码检测 + 按行/段切分；docx：python-docx</text><rect x="500" y="425" width="450" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="518" y="455" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">文档模型 JSON</text><text x="518" y="479" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">blocks / runs / 样式 / 表格 / 图片</text><rect x="500" y="565" width="450" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="518" y="595" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">进度与统计 API</text><text x="518" y="619" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">GET 文章 · PATCH progress · session 汇总</text><rect x="1020" y="145" width="430" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="1038" y="175" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">articles</text><text x="1038" y="199" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">id · title · kind · hash · doc_json · 字数</text><rect x="1020" y="285" width="430" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="1038" y="315" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">article_progress</text><text x="1038" y="339" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">cursor · correct · wrong · 用时 · 完成时间</text><rect x="1020" y="425" width="430" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="1038" y="455" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">article_chars</text><text x="1038" y="479" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">pos · status · errors（仅已输入行）</text><rect x="1020" y="565" width="430" height="96" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="1038" y="595" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">sessions</text><text x="1038" y="619" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">mode=article 的速度/正确率/时长</text><line x1="440" y1="193" x2="500" y2="193" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="333" x2="500" y2="333" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="473" x2="500" y2="473" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="440" y1="613" x2="500" y2="613" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" y1="193" x2="440" y2="193" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" y1="333" x2="440" y2="333" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" y1="473" x2="440" y2="473" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" y1="613" x2="440" y2="613" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="725" y1="241" x2="725" y2="285" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="725" y1="381" x2="725" y2="425" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="950" y1="473" x2="1020" y2="473" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="725" y1="613" x2="1020" y2="613" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1020" y1="193" x2="950" y2="193" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="1020" y1="333" x2="950" y2="333" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="60" y="720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">关键约束</text><text x="60" y="748" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">· 只监听 127.0.0.1；文件不离开本机；不调用外部转换服务。</text><text x="60" y="772" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">· .docx 用 python-docx 解析，保留段落/样式/表格/图片；不做 Word 分页级像素还原。</text><text x="60" y="796" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">· 单篇默认上限 20,000 字；超限提示拆分或后续虚拟化。</text><text x="60" y="820" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">· 文章错误独立记录，不写入看图拆字的科目学习状态。</text></svg>