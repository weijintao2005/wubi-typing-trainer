<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 z" fill="#7d756a"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#23201c" flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1500" height="820" fill="#f4f1ea"/>
<text x="40" y="46" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="24" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">文章练习 · 单字状态机</text>
<text x="40" y="72" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">以“字”为单位推进；错误保留红色记录，正确后自动进入下一字</text>
<rect x="70" y="300" width="230" height="100" rx="12" fill="#fffdf8" stroke="#b9b3a8" stroke-width="1.2" opacity="1"/><text x="88" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">未输入</text><text x="88" y="354" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">原文淡灰 #b9b3a8</text><rect x="380" y="300" width="230" height="100" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="398" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">输入中</text><text x="398" y="354" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">当前字高亮 / 缓存已按键</text><rect x="760" y="190" width="230" height="100" rx="12" fill="#fffdf8" stroke="#2f7d5d" stroke-width="1.2" opacity="1"/><text x="778" y="220" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">正确</text><text x="778" y="244" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">黑色 #23201c</text><rect x="760" y="410" width="230" height="100" rx="12" fill="#fffdf8" stroke="#c0392b" stroke-width="1.2" opacity="1"/><text x="778" y="440" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">错误</text><text x="778" y="464" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">红色 #c0392b + 波浪线</text><rect x="1110" y="300" width="230" height="100" rx="12" fill="#fffdf8" stroke="#2f6f9f" stroke-width="1.2" opacity="1"/><text x="1128" y="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" fill="#23201c" font-weight="600" text-anchor="start" opacity="1">下一字</text><text x="1128" y="354" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">滚动 / 段落自动推进</text><line x1="300" y1="350" x2="380" y2="350" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="338" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="middle" opacity="1">开始输入</text><line x1="610" y1="330" x2="760" y2="250" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="650" y="276" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="middle" opacity="1">编码完整且匹配</text><line x1="610" y1="370" x2="760" y2="450" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="648" y="424" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="middle" opacity="1">错键 / 跳过</text><line x1="760" y1="480" x2="610" y2="370" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="648" y="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="middle" opacity="1">重试正确</text><line x1="990" y1="240" x2="1110" y2="330" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1022" y="298" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">完成</text><line x1="990" y1="460" x2="1110" y2="370" stroke="#7d756a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1018" y="438" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">跳过</text><text x="70" y="528" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" fill="#c0392b" font-weight="500" text-anchor="start" opacity="1">错误记录保留红色，不因随后改对而消失；当前字保持高亮直到推进。</text><rect x="70" y="570" width="1360" height="120" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="92" y="600" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">示例：目标「弥」= XQIY</text><text x="92" y="630" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">输入 X Q I R  ✗ 错键 → 当前字变红并保留错误记录；继续输入 X Q I Y ✓ → 完成，进入下一字。</text><text x="92" y="658" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">标点：，→  ,    。→  .    ？→  ?    ！→  !    ；→  ;    ：→  :    “”→  &quot;    （）→ ( )</text><rect x="70" y="706" width="660" height="82" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="90" y="734" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">推进规则</text><text x="90" y="758" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">只有“正确完成”或“跳过”才推进；错误不会自动跳过该字。</text><text x="90" y="778" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">段落、表格行、图片边界自动越过，不需要输入换行。</text><rect x="750" y="706" width="680" height="82" rx="12" fill="#fffdf8" stroke="#d8cebd" stroke-width="1.2" opacity="1"/><text x="770" y="734" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#23201c" font-weight="700" text-anchor="start" opacity="1">着色规则</text><text x="770" y="758" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">正确过的字保持黑色；出过错的字保持红色（即使随后改对）。</text><text x="770" y="778" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#7d756a" font-weight="400" text-anchor="start" opacity="1">未输入保持淡灰；当前字用底色/左侧光标提示。</text></svg>